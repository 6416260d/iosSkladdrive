name: TestFlight
on:
  push: { branches: [main, release/appstore-1.0] }
  workflow_dispatch:
    inputs:
      upload:
        description: Загрузить подписанную сборку в App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HAS_SIGNING_SETTINGS: ${{ secrets.APPLE_TEAM_ID != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Настройки подписи Apple заданы
        if: env.HAS_SIGNING_SETTINGS == 'true'
        run: echo 'Четыре настройки подписи заданы. Их действительность проверяется при подписанной загрузке.' >> "$GITHUB_STEP_SUMMARY"
      - name: Требуются настройки подписи Apple
        if: env.HAS_SIGNING_SETTINGS != 'true'
        run: echo 'Для подписанной загрузки добавьте APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID и ASC_KEY_P8 в секреты этого репозитория.' >> "$GITHUB_STEP_SUMMARY"
      - name: Сборка для симулятора iPhone
        run: |
          xcodebuild -version
          xcodebuild -project Courier.xcodeproj -scheme Courier -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Courier" \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "$RUNNER_TEMP/Courier/Build/Products/Debug-iphonesimulator/Курьер.app" "$RUNNER_TEMP/Courier-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Courier-Simulator
          path: ${{ runner.temp }}/Courier-Simulator.zip
      - name: Проверка Release для iPhone
        run: |
          xcodebuild -project Courier.xcodeproj -scheme Courier -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Courier-check.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          app="$RUNNER_TEMP/Courier-check.xcarchive/Products/Applications/Курьер.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = ru.mise.courier
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 1.0
          test -s "$app/PrivacyInfo.xcprivacy"
  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ключ App Store Connect
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          : "${P8:?Добавьте ASC_KEY_P8 в секреты репозитория}"
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Сборка
        run: |
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
                -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}")
          xcodebuild -project Courier.xcodeproj -scheme Courier -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Courier.xcarchive" archive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Courier.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}"
      - name: Убрать ключ
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
